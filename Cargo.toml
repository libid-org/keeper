[package]
name = "keeper"
version = "0.4.0"
edition = "2021"
# Inherited floor: libid-tlsn pulls the `tlsn` MPC graph (TLSNotary's
# `mpz` crates declare 1.95) and the AWS SDK crates via libid-signer
# declare 1.94.1.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/keeper"
description = "Permissionless keeper that keeps Google's JWT signing keys trusted on chain: obtains MPC-TLS notarized readings of Google's JWKS from a libid notary and submits rotate() to GoogleJwtRoots on every configured network, paying the Notary Fee."
# A binary + companion library, never a registry crate: it names git-only
# libid-rs crates (libid-tlsn), which cargo refuses to publish.
publish = false

[lib]
name = "keeper"
path = "src/lib.rs"

[[bin]]
name = "keeper"
path = "src/main.rs"

[dependencies]
# ── libid-rs shared crates ──────────────────────────────────────────────────
# The same release the notary takes, so a keeper and a notary built from these
# manifests share one copy of every type: `NotarizedSession` is
# libid-transcript's `AttestationWire`, the frame both sides read and write,
# and both sides run the tlsn pin libid-tlsn carries. Moves with the notary's
# pin, never on its own.
libid-crypto = "0.7"
libid-signer = "0.7"
# The JWKS prover runs the MPC-TLS session itself (libid-tlsn, git-only), and
# states its layout and reads the frame back (libid-transcript).
libid-tlsn = { git = "https://github.com/libid-org/libID-rs", tag = "v0.7.0" }
libid-transcript = "0.7"

# ── contract bindings + deploy helpers ──────────────────────────────────────
# The registry crate is fine here: it has no tlsn-adjacent types. Its
# `GoogleJwtRoots` verifies through the Notary Service (`rotate(bytes,bytes)
# payable`, `quoteRotation()`), and it embeds the forge artifacts the e2e
# deploys, which are not in git — so it cannot be taken from the repo.
libid-contracts = "0.18"
# Follows libid-contracts' and libid-signer's alloy line. The bindings and
# the wallet take and return alloy types, so another major here would be a
# second, incompatible `Provider`.
alloy = { version = "2", features = [
    "contract",
    "json-rpc",
    "providers",
    "network",
    "transport-http",
    "serde",
] }

# ── everything else ─────────────────────────────────────────────────────────
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
num-bigint = "0.5"
# Plain-HTTPS fetch of Google's live JWKS (the cheap poll; notarization
# happens only when a rotation is actually needed). The same 0.13 alloy's
# HTTP transport pulls, with the TLS backend it already turns on (`rustls`
# is 0.12's `rustls-tls`: aws-lc-rs plus the platform verifier), so the build
# carries ONE reqwest and one TLS stack.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "signal",
] }
toml = "1"
# The RPC client's layers implement alloy's transport, a tower `Service`.
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

# libid-tlsn's own manifest names libid-transcript by path, which a git
# checkout resolves to the git copy. This points it at the crates.io release
# the keeper takes, so the prover and the keeper share one `Layout` and one
# `AttestationWire`.
[patch."https://github.com/libid-org/libID-rs"]
libid-transcript = "0.7"
