[package]
name = "keeper"
version = "0.2.0"
edition = "2021"
# Inherited floor: libid-tlsn pulls the `tlsn` MPC graph (TLSNotary
# alpha.15's `mpz` crates declare 1.95) and the AWS SDK crates via libid-signer
# declare 1.94.1.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/keeper"
description = "Permissionless keeper that keeps Google's JWT signing keys trusted on chain: obtains MPC-TLS notarized readings of Google's JWKS from a libid notary and submits rotate() to GoogleJwtRoots on every configured network, paying the Notary Fee."
# A binary + companion library, never a registry crate: it names git-only
# libid-rs crates (libid-tlsn) and carries `[patch]` tables, which cargo
# refuses to publish.
publish = false

[lib]
name = "keeper"
path = "src/lib.rs"

[[bin]]
name = "keeper"
path = "src/main.rs"

[dependencies]
# ── libid-rs shared crates ──────────────────────────────────────────────────
# The same tag the notary pins for its libid-rs crates, so a keeper and a
# notary built from these manifests share one copy of every type: libid-tlsn
# is git-only and exposes sibling-crate types, and `NotarizedSession` is
# libid-transcript's `AttestationWire`, the frame both sides read and write.
# Moves with the notary's pin, never on its own.
libid-crypto = { git = "https://github.com/libid-org/libid-rs", tag = "v0.3.0" }
libid-signer = { git = "https://github.com/libid-org/libid-rs", tag = "v0.3.0" }
# The JWKS prover runs the MPC-TLS session itself (libid-tlsn), states its
# layout and reads the frame back (libid-transcript), and the mock encodes the
# record (libid-ceremony). All at the same tag, or cargo carries two copies of
# the types.
libid-tlsn = { git = "https://github.com/libid-org/libid-rs", tag = "v0.3.0" }
libid-transcript = { git = "https://github.com/libid-org/libid-rs", tag = "v0.3.0" }
libid-ceremony = { git = "https://github.com/libid-org/libid-rs", tag = "v0.3.0" }
k256 = { version = "0.13", features = ["ecdsa"] }

# ── contract bindings + deploy helpers ──────────────────────────────────────
# The registry crate is fine here: it has no tlsn-adjacent types. 0.7.0 is
# the first release whose `GoogleJwtRoots` verifies through the Notary
# Service (`rotate(bytes,bytes) payable`, `quoteRotation()`) and whose
# artifacts carry `NotaryService`; it embeds forge output that is not in git,
# so it cannot be taken from the repo before it is published.
libid-contracts = "0.7.0"
alloy = { version = "1", features = [
    "contract",
    "providers",
    "network",
    "transport-http",
    "serde",
] }

# ── everything else ─────────────────────────────────────────────────────────
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
num-bigint = "0.4"
# Plain-HTTPS fetch of Google's live JWKS (the cheap poll; notarization
# happens only when a rotation is actually needed).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "signal",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The mock prover pins its request bytes against hyper's own encoder; the
# example stamps its output in RFC 3339.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
alloy = { version = "1", features = ["node-bindings"] }
tempfile = "3"

[patch."https://github.com/tlsnotary/tlsn"]
# The notary's own patch, repeated here because `[patch]` is read from the
# The notary carries the same pin; cargo ignores dependency-workspace patches,
# so a crate that runs the prover repeats it. The two move together.
# without it the keeper's prover would run upstream alpha.15 against a notary
# running the patched tree. WIP: TLSNotary #1178 reclaims the channel and
# #1179 preserves hash-opening order for multi-range commitments. Return to a
# release tag when both ship -- in lockstep with the notary.
tlsn = { git = "https://github.com/libid-org/tlsn", rev = "550220ee18a8c0bb60217d58cb73f5fd2e74e441" }

# TLSNotary #1173 (per-consumer RCOT instances) needs KOS instance-domain
# separation, carried by libid-org/mpz on top of alpha.6 together with the
# executor-lifetime fix and the typed `InstanceId` (libid-org/mpz#1). Cargo
# ignores dependency-workspace patches, so this repeats the notary's pin; the
# two must move together.
[patch."https://github.com/privacy-ethereum/mpz"]
clmul = { git = "https://github.com/libid-org/mpz", rev = "4db9454a0b6380f1a23a7b4807989d866f838fff" }
