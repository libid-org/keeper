mpz-share-conversion-core = { git = "https://github.com/libid-org/mpz", rev = "4db9454a0b6380f1a23a7b4807989d866f838fff" }
mpz-vm-core = { git = "https://github.com/libid-org/mpz", rev = "4db9454a0b6380f1a23a7b4807989d866f838fff" }
mpz-zk = { git = "https://github.com/libid-org/mpz", rev = "4db9454a0b6380f1a23a7b4807989d866f838fff" }
mpz-zk-core = { git = "https://github.com/libid-org/mpz", rev = "4db9454a0b6380f1a23a7b4807989d866f838fff" }
