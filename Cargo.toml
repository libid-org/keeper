[package]
name = "keeper"
version = "0.1.0"
edition = "2021"
# Inherited floor: the notary lib dependency pulls the `tlsn` MPC graph
# (unstable `cfg_select!` before 1.94) and the AWS SDK crates via
# libid-signer declare 1.94.1.
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/keeper"
description = "Permissionless keeper that keeps Google JWKS roots fresh on-chain: obtains MPC-TLS notarized readings of Google's JWKS from a libid notary and submits rotate() to the JWKS contracts on every configured network."
# A binary + companion library, never a registry crate: it names `notary`
# and the libid-rs crates (git-only sources), which cargo refuses to publish.
publish = false

[lib]
name = "keeper"
path = "src/lib.rs"

[[bin]]
name = "keeper"
path = "src/main.rs"

[dependencies]
# ── the notary service's companion library ──────────────────────────────────
# Prover-side JWKS machinery: `jwks::prover::notarize_jwks` (the real MPC-TLS
# round trip against a running notary), `jwks::mock::MockProver` (the
# plain-TLS test seam), and the `JwksRotationProof` wire type. The tag pins
# the exact tlsn/libid-rs graph the notary released with.
notary = { git = "https://github.com/libid-org/notary", tag = "v0.2.0" }

# ── libid-rs shared crates ──────────────────────────────────────────────────
# Same git tag as the notary dependency pins, so cargo unifies them with the
# copies arriving through `notary` — mixing the crates.io releases with the
# git copies would put two incompatible versions of the same types in the
# graph (libid-tlsn is git-only and exposes sibling-crate types).
libid-crypto = { git = "https://github.com/libid-org/libid-rs", tag = "v0.2.0" }
libid-signer = { git = "https://github.com/libid-org/libid-rs", tag = "v0.2.0" }

# ── contract bindings + deploy helpers ──────────────────────────────────────
# The registry crate is fine here: it has no tlsn-adjacent types.
libid-contracts = "0.3.0"
alloy = { version = "1", features = [
    "contract",
    "providers",
    "network",
    "transport-http",
    "serde",
] }

# ── everything else ─────────────────────────────────────────────────────────
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
# The mock prover signs with a caller-provided k256 key.
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
num-bigint = "0.4"
# Plain-HTTPS fetch of Google's live JWKS (the cheap poll; notarization
# happens only when a rotation is actually needed).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
alloy = { version = "1", features = ["node-bindings"] }
tempfile = "3"
