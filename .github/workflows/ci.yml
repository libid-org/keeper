name: CI

# Two jobs: rust (fmt/clippy/test) and dco — the same shape as the other
# libid-org repos (notary, libid-rs), so a contributor moving between them
# meets the same gates.
#
# Every third-party action is pinned by commit SHA, with the tag in a comment,
# so a moved tag cannot change what executes.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Superseded pushes stop burning minutes immediately.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Every cargo invocation, not just clippy, treats warnings as errors.
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  # Incremental state is written, cached and never read in CI — every job
  # starts from a restored cache and never rebuilds the same crate twice.
  CARGO_INCREMENTAL: 0
  # The stable toolchain every job builds on, pinned so a new release cannot
  # turn a PR red on its own. It is ABOVE the crate's rust-version floor (1.95,
  # inherited — see Cargo.toml), which nothing here exercises.
  RUST_VERSION: 1.98.1
  # Nightly is for `cargo +"$NIGHTLY" fmt` ONLY: rustfmt options like
  # `imports_granularity` are nightly-only, and stable rustfmt does not reject
  # them — it silently IGNORES them and reports success. Dated pin so a
  # nightly formatting change cannot turn the tree red overnight.
  NIGHTLY: nightly-2026-08-10
  # The notary the e2e job talks to: the PUBLISHED image, pulled not built, so
  # the rotation is proven against the same binary a deployment runs. One line
  # to bump.
  NOTARY_IMAGE: ghcr.io/libid-org/notary:custom-1f54c19
  # The deploy tool that puts the contracts on the throwaway chain, and the
  # network file it converges that chain onto. Both belong to one
  # chain-configurations release and move together.
  LIBID_DEPLOY_URL: https://github.com/libid-org/chain-configurations/releases/download/v0.7.0/libid-deploy-0.7.0-x86_64-unknown-linux-gnu.tar.gz
  LIBID_DEPLOY_NETWORK_URL: https://raw.githubusercontent.com/libid-org/chain-configurations/v0.7.0/networks/local-dev.toml
  # Anvil dev key #1. Public test material. The deployed NotaryService trusts
  # this key's address, so the notary must sign with it.
  NOTARY_KEY: 59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
  # Anvil dev key #0, prefunded: it deploys the stack and, in the test, pays
  # gas and the Notary Fee. Public test material.
  DEPLOY_KEY: ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80

jobs:
  # ---------------------------------------------------------------------------
  # Rust: formatting, clippy, tests.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nightly first, stable second: this action makes the LAST toolchain it
      # installs the default, and everything except `cargo +"$NIGHTLY" fmt`
      # must run on the pinned stable.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      # The e2e test spawns `anvil` (alloy node-bindings).
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting (nightly rustfmt)
        # +"$NIGHTLY", not +nightly: the bare channel name makes rustup fetch
        # the LATEST nightly (without the rustfmt component) instead of the
        # pinned one installed above.
        run: cargo +"$NIGHTLY" fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # E2E: the rotation path for real — the released notary image, the contract
  # stack as the deploy tool lays it down, and Google's LIVE key set.
  #
  # `cargo test --all` in the `rust` job covers everything but MPC-TLS, with
  # the mock prover standing in. This job covers the rest, so the two together
  # leave no part of the path unproven. Nothing here is a stand-in: the notary
  # is the image a deployment runs, the contracts are what `libid-deploy
  # apply` produces, and the endpoint is www.googleapis.com, which
  # GoogleJwtRoots pins and no local TLS fixture can impersonate.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (live Google)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # anvil: the throwaway chain the stack is deployed onto.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Start the chain
        run: |
          set -euo pipefail
          anvil --host 127.0.0.1 --port 8545 > anvil.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8545) 2>/dev/null; then
              echo "anvil is listening"
              exit 0
            fi
            sleep 1
          done
          echo "::error::anvil did not come up"
          cat anvil.log
          exit 1

      - name: Deploy the stack with libid-deploy
        run: |
          set -euo pipefail
          curl -fsSL "$LIBID_DEPLOY_URL" | tar xz --strip-components=1
          curl -fsSL "$LIBID_DEPLOY_NETWORK_URL" -o local-dev.toml
          # --dev takes factory ownership by impersonation, which the tool
          # honours only against anvil/hardhat; --confirm-fresh-deploy is
          # required while the factory has no code, which on a chain started
          # seconds ago is always.
          ./libid-deploy apply \
            --network local-dev.toml \
            --signer "$DEPLOY_KEY" \
            --yes --confirm-fresh-deploy --dev

      - name: Name the deployed contract to the test
        run: |
          set -euo pipefail
          python3 - local-dev.toml >> "$GITHUB_ENV" <<'PY'
          import sys, tomllib

          identity = tomllib.load(open(sys.argv[1], "rb")).get("identity", {})
          # The keeper's name for the contract, and the name the same entry
          # carried before it became GoogleJwtRoots.
          for key in ("google_jwt_roots", "identity_jwks_roots"):
              if identity.get(key):
                  print(f"KEEPER_E2E_GOOGLE_JWT_ROOTS={identity[key]}")
                  break
          else:
              sys.exit(f"no roots address under [identity]: {sorted(identity)}")
          PY

      - name: Start the notary
        run: |
          set -euo pipefail
          docker run -d --name notary -p 127.0.0.1:7047:7047 \
            -e NOTARY_HOST=0.0.0.0 \
            -e NOTARY_PORT=7047 \
            -e NOTARY_WS_PORT=0 \
            -e SIGNING_KEY="$NOTARY_KEY" \
            "$NOTARY_IMAGE"
          # The wire port accepts only once the signer is ready, so a connect
          # is the readiness signal.
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/7047) 2>/dev/null; then
              echo "the notary is listening"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the notary did not come up"
          docker logs notary
          exit 1

      - name: Rotate through the notary against live Google
        env:
          KEEPER_E2E_NOTARY: 127.0.0.1:7047
          KEEPER_E2E_RPC: http://127.0.0.1:8545
        run: cargo test --test e2e_real -- --ignored --nocapture

      - name: Logs
        if: failure()
        run: |
          docker logs notary || true
          cat anvil.log || true

  # ---------------------------------------------------------------------------
  # DCO: every commit carries a Signed-off-by trailer, as CONTRIBUTING.md
  # promises. Plain git over the event's commit range — no marketplace action,
  # so there is nothing to pin and nothing to compromise.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR base and the push's `before` are reachable
          # only in a complete clone, and the repo is small.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            # Push to main. `before` is all zeros on a branch creation and may
            # be unreachable after a force push; in either case there is no
            # honest range, so fall back to the head commit alone rather than
            # failing on plumbing.
            zero="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            else
              echo "No usable push range; checking only the head commit."
              range="$PUSH_AFTER^!"
            fi
          fi

          # Merge commits are exempt, as in the standard DCO probot: nobody
          # authors a merge, and the merged commits are themselves in range.
          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if git log -1 --format=%B "$sha" \
              | grep -Fxiq "Signed-off-by: $author"; then
              continue
            fi
            echo "::error::commit $sha lacks Signed-off-by matching its author: $author"
            git log -1 --format='  %h %s (%an)' "$sha"
            missing=1
          done

          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md: every commit must certify the DCO."
            exit 1
          fi
          echo "All commits in $range are signed off."
